name: EvrythingAI Daily Newsletter

on:
  schedule:
    - cron: '30 0 * * *'    # 00:30 UTC = 6:00 AM IST daily
  workflow_dispatch:         # Manual trigger from GitHub UI anytime

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Restore private subscriber list
        env:
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
        run: |
          if [ -z "$SUBSCRIBERS_JSON" ]; then
            echo "SUBSCRIBERS_JSON GitHub Actions secret is required" >&2
            exit 1
          fi
          printf '%s' "$SUBSCRIBERS_JSON" > subscribers.json

      - name: Run EvrythingAI pipeline
        run: node index.js --force
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
